# Render Blueprint for the web service (the API and the built front end, one container).
#
# The database is NOT here on purpose. Roundturn's six database roles are made by hand once, with
# `python -m tradejournal.pg.provision_hosted`, which needs the database to exist first; a Blueprint that created the
# database and the service together would start the service before the roles and the migrations are there.
#
# The secrets are not here either, and are not asked for at creation: the first deploy starts without them and stops
# ("refusing to start unconfigured"), and you then paste them all at once (Environment, "Add from .env").
# docs/runbooks/first-deploy.md has the whole order and builds the file to paste. The settings it holds:
#
#   TJ_APP_ORIGIN                     where the browser reaches the app: https://<host>, no slash, no path
#   TJ_SESSION_SECRET                 64 hexadecimal characters, fixed across deploys
#   TJ_DATABASE_URL                   the app_rw role's address (the private one, inside Render)
#   TJ_LOGIN_DATABASE_URL             the app_login role's address
#   TJ_KINDE_DOMAIN, TJ_KINDE_CLIENT_ID, TJ_KINDE_CLIENT_SECRET     the Kinde web application (all three, or none)
#   TJ_S3_ENDPOINT, TJ_S3_BUCKET, TJ_S3_ACCESS_KEY_ID, TJ_S3_SECRET_ACCESS_KEY    the private screenshot bucket (all four, or none)
#   TJ_EMAIL_API_KEY, TJ_EMAIL_FROM        the email service (Resend) and the sender address (both, or none: with none the beta form answers 503)
#
# Plan names and fields were taken from Render's Blueprint reference (render.com/docs/blueprint-spec); if the form
# rejects one, change it in the dashboard and fix it here.

services:
  - type: web
    name: roundturn
    runtime: docker
    region: oregon # keep in the same region as the database, so the private address works
    plan: 0.5c-512mb # the smallest; watch memory after the first big import and move up if it climbs (design doc 02, "Sizing")
    branch: main
    autoDeployTrigger: commit # deploys every commit to main. "checksPass" would wait on the unrelated Workers Builds check, which is red
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz # not /healthz: a new instance whose database is missing a migration stays out of traffic and the old one keeps serving
    envVars:
      # A new person needs an invitation code. "open" lets anyone sign up.
      - key: TJ_SIGNUP_MODE
        value: invite

  # The sweep, three steps in one run (`sweep all --apply`): finishes account deletions (rows, picture files, the person at
  # Kinde); sends the "your access has ended" email once; and removes beta sign-ups that have no account 24 hours after their
  # code was made. It runs the same image as the web service with a different command, every hour (the last step has a
  # 24-hour promise, so a daily run would keep a sign-up up to 47 hours). A cron job is billed only for the seconds it
  # runs, with a floor of $1 a month (render.com/docs/cronjobs; check the pricing page).
  #
  # Its settings are not in this file (Render asks for `sync: false` values only when a Blueprint is first created): add them
  # in the job's Environment page. docs/runbooks/first-deploy.md, "Adding the deletion sweep", builds the file to paste:
  #   TJ_SWEEP_DATABASE_URL                                   the app_sweep role's address (private host)
  #   TJ_KINDE_DOMAIN                                         the Kinde TENANT address (https://<tenant>.kinde.com), NOT the web
  #                                                           service's custom domain: Kinde refuses the management token there
  #   TJ_KINDE_M2M_CLIENT_ID, TJ_KINDE_M2M_CLIENT_SECRET      the machine-to-machine Kinde application
  #   TJ_S3_ENDPOINT, TJ_S3_BUCKET, TJ_S3_ACCESS_KEY_ID, TJ_S3_SECRET_ACCESS_KEY    the same bucket as the web service
  #   TJ_EMAIL_API_KEY, TJ_EMAIL_FROM                         the same two as the web service (without them the email step
  #                                                           refuses and the run ends with an error; the other two steps still run)
  - type: cron
    name: roundturn-sweep
    runtime: docker
    region: oregon
    schedule: "0 * * * *"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m tradejournal.pg.sweep all --apply

  # The second copy of the screenshot bucket (`python -m tradejournal.filebackup`; docs/runbooks/deploy.md, section 2,
  # step 4). R2 keeps no old versions, so a deleted or overwritten picture is otherwise gone for good. The job copies what
  # the second bucket lacks and forgets what has been gone from the source for 30 days. It starts as a DRY RUN (no
  # `--apply`): it prints counts and changes nothing. Look at one run, then add `--apply` here and in the dashboard's
  # Start Command in the same change so the file and the dashboard agree.
  #
  # Its settings are not in this file (same reason as the sweep): add them in the job's Environment page.
  #   TJ_S3_ENDPOINT, TJ_S3_BUCKET, TJ_S3_ACCESS_KEY_ID, TJ_S3_SECRET_ACCESS_KEY    the source bucket (the web service's):
  #                                                           use a token that can only READ it
  #   TJ_BACKUP_S3_ENDPOINT, TJ_BACKUP_S3_BUCKET, TJ_BACKUP_S3_ACCESS_KEY_ID, TJ_BACKUP_S3_SECRET_ACCESS_KEY
  #                                                           the copy, with a token limited to that one bucket
  - type: cron
    name: roundturn-backup
    runtime: docker
    region: oregon
    schedule: "30 3 * * *"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m tradejournal.filebackup
