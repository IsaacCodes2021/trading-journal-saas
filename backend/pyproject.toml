[project]
name = "tradejournal"
version = "0.1.0"
description = "Futures trading journal and analytics"
# Tested on 3.12 only (CI, the container image and local development all use it).
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "tzdata>=2024.1",
    # The hosted API (tradejournal/api).
    "fastapi>=0.142,<1",
    "python-multipart>=0.0.20",  # FastAPI needs it to read multipart uploads (screenshots, CSV imports)
    "uvicorn[standard]>=0.30",  # the server the container runs; [standard] keeps the fast event loop and parser (uvloop, httptools)
    "psycopg[binary,pool]>=3.2",  # Postgres driver and connection pool (tradejournal/pg)
    "nh3>=0.3.7",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    # FastAPI's test client
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/F/W: errors and style; I: import order; B: likely bugs; UP: modern syntax; S: security checks
# (the free substitute for code scanning on a private repository).
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # the formatter wraps what it can; the rest are long strings and comments
    "B905",  # zip(strict=...) would change behavior where lengths may legitimately differ
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest tests work
    "S311",  # seeded random is fine for test data
    "S608",  # test helpers build SQL from fixed table names
]
