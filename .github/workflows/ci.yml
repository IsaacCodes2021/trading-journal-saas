name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag is in the comment). Dependabot keeps them current.
jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version; --frozen refuses to change the lock.
      - name: Install dependencies from the lock file
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      - name: Tests
        run: uv run --frozen pytest -q

      # run.bat, run.sh and the Dockerfile install from requirements.txt. It is generated from
      # uv.lock; if they ever disagree, regenerate it (command in the README, "Dependencies").
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          diff requirements.txt "$RUNNER_TEMP/requirements.txt"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Checks the exact pinned versions against known vulnerabilities (requirements.txt is complete
      # and hash-pinned, so no resolving or installing is needed).
      - name: pip-audit
        run: uvx pip-audit --requirement backend/requirements.txt --no-deps --disable-pip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip
          persist-credentials: false

      # Free for personal accounts. If the repo moves to a GitHub organization, this action needs a
      # license key; swap in the gitleaks binary then.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --tag tradejournal:ci backend

      # Smoke test: the image's dependencies are complete and the app imports. (It does not start
      # the server: the bind address is still hardcoded to 127.0.0.1, which is an M2 change.)
      - name: Import smoke test
        run: docker run --rm tradejournal:ci python -c "import tradejournal.ui.app"
