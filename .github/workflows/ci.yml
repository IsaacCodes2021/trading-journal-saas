name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag is in the comment). Dependabot keeps them current.
jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # A real Postgres, the same major version as production (doc 02 section 7). The password is for this throwaway
    # container only; it exists for the length of the job.
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version; --frozen refuses to change the lock.
      - name: Install dependencies from the lock file
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      # Creates the two roles (owner and request-serving) and the test databases, then writes the connection URLs
      # to backend/.env.test, which the Postgres tests read.
      - name: Prepare the test database
        env:
          PGPASSWORD: ci-throwaway
        run: >-
          uv run --frozen python -m tradejournal.pg.provision
          --superuser-url postgresql://postgres@localhost:5432/postgres --env-file .env.test

      # TJ_REQUIRE_POSTGRES turns "no database configured" from a skip into a failure, so these tests cannot be
      # silently skipped in CI.
      # PGPASSWORD (the throwaway container's superuser) lets the hosted-setup test make its stand-in administrator.
      - name: Tests
        env:
          TJ_REQUIRE_POSTGRES: "1"
          PGPASSWORD: ci-throwaway
        run: uv run --frozen pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Checks the exact versions in uv.lock against known vulnerabilities. The export is complete and
      # hash-pinned, so no resolving or installing is needed. It is produced here, never committed: a
      # committed requirements.txt made Dependabot edit it instead of uv.lock.
      - name: Export the runtime lock
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      - name: pip-audit
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false

      # The gitleaks binary rather than its GitHub Action: the action scans only the commit range of
      # the push event, which fails on a repository's first push, and needs a paid license for
      # organization accounts. Version and checksum are pinned; bump both together (the checksum
      # is in gitleaks_<version>_checksums.txt on the release page).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The context is the repository root: the image builds the front end too (backend/Dockerfile).
      - name: Build
        run: docker build --file backend/Dockerfile --tag tradejournal:ci .

      # Really start it, and fetch pages from it: the API answers, the built SPA is served with the security
      # headers, and hashed assets are cached for a year.
      - name: Starts and serves
        run: |
          docker run --detach --name tj --publish 8000:8000 \
            --env TJ_ENV=development --env TJ_APP_ORIGIN=http://localhost:8000 tradejournal:ci
          for _ in $(seq 1 30); do curl --fail --silent http://localhost:8000/healthz > /dev/null && break; sleep 1; done
          curl --fail --silent http://localhost:8000/healthz | grep --quiet '"status":"ok"'
          # Readiness: with no database configured, a development container is ready and says so.
          curl --fail --silent http://localhost:8000/readyz | grep --quiet '"database":"not configured"'
          curl --fail --silent --header 'Accept: text/html' http://localhost:8000/trades | grep --quiet 'id="root"'
          headers=$(curl --fail --silent --head --header 'Accept: text/html' http://localhost:8000/)
          echo "$headers" | grep --ignore-case --quiet "^content-security-policy:.*script-src 'self'"
          echo "$headers" | grep --ignore-case --quiet '^x-content-type-options: nosniff'
          asset=$(curl --fail --silent --header 'Accept: text/html' http://localhost:8000/ | grep --only-matching '/assets/[^"]*\.js' | head -1)
          test -n "$asset"
          curl --fail --silent --head "http://localhost:8000$asset" \
            | grep --ignore-case --quiet 'cache-control: public, max-age=31536000, immutable'

      # Alive is not ready: a production container with no database answers /healthz and refuses /readyz (503), so a
      # platform health check on /readyz would never send it traffic.
      - name: Production without a database is alive but not ready
        run: |
          docker run --detach --name tj-prod --publish 8001:8000 --env TJ_ENV=production \
            --env TJ_APP_ORIGIN=https://app.example.com --env TJ_SESSION_SECRET=$(openssl rand -hex 32) tradejournal:ci
          for _ in $(seq 1 30); do curl --silent --output /dev/null http://localhost:8001/healthz && break; sleep 1; done
          curl --fail --silent http://localhost:8001/healthz | grep --quiet '"status":"ok"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8001/readyz)" = "503"
          curl --silent http://localhost:8001/readyz | grep --quiet '"database":"not configured"'
          docker stop tj-prod

      # Fail closed: the image defaults to production mode, which must refuse to start without its settings.
      - name: Refuses to start unconfigured
        run: |
          set +e
          output=$(docker run --rm tradejournal:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep --quiet 'TJ_SESSION_SECRET is required in production'

      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id tradejournal:ci -u)" = "10001"

      - name: Container log (on failure)
        if: failure()
        run: docker logs tj || true

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # Same version as `packageManager` in package.json. Installed from the npm registry rather than
      # through Corepack, which is dropped from Node 25 and later.
      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      # --frozen-lockfile refuses to change the lock file. pnpm-workspace.yaml holds the supply-chain
      # settings: a 24-hour release delay, and dependency build scripts fail the install unless reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The committed types must be exactly what the committed backend/openapi.json generates, so the API and the
      # front end cannot drift. (The other half of the chain, openapi.json matching the Python code, is a pytest test
      # in the "Lint and test" job.) Runs before the type check: a stale file would otherwise surface as a confusing
      # type error.
      - name: API types match backend/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails if the entry chunk is over 150 KB gzipped (the chart and editor must stay lazily loaded).
      - name: Bundle budget
        run: pnpm check:bundle

      # Raw HTML only through SafeHtml; no build-time environment values; no source maps or secret-shaped strings in
      # the build (doc 04, launch gates). --require-dist makes a missing build a failure, not a skipped check.
      - name: Security gates
        run: pnpm check:security --require-dist

      - name: Dependency audit
        run: pnpm audit --audit-level high

  site:
    name: Marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # No dependencies: Node's own test runner. Checks the pages (nothing external or inline, links resolve, the
      # disclaimers are present, the CSP is strict, the home page sends people to the app) and the Worker's routing.
      - name: Tests
        run: node --test "site/test/*.test.mjs"
