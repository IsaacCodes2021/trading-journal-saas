name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the tag is in the comment). Dependabot keeps them current.
jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version; --frozen refuses to change the lock.
      - name: Install dependencies from the lock file
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      - name: Tests
        run: uv run --frozen pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Checks the exact versions in uv.lock against known vulnerabilities. The export is complete and
      # hash-pinned, so no resolving or installing is needed. It is produced here, never committed: a
      # committed requirements.txt made Dependabot edit it instead of uv.lock.
      - name: Export the runtime lock
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      - name: pip-audit
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false

      # The gitleaks binary rather than its GitHub Action: the action scans only the commit range of
      # the push event, which fails on a repository's first push, and needs a paid license for
      # organization accounts. Version and checksum are pinned; bump both together (the checksum
      # is in gitleaks_<version>_checksums.txt on the release page).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The context is the repository root: the image builds the front end too (backend/Dockerfile).
      - name: Build
        run: docker build --file backend/Dockerfile --tag tradejournal:ci .

      # Really start it, and fetch pages from it: the API answers, the built SPA is served with the security
      # headers, and hashed assets are cached for a year.
      - name: Starts and serves
        run: |
          docker run --detach --name tj --publish 8000:8000 \
            --env TJ_ENV=development --env TJ_APP_ORIGIN=http://localhost:8000 tradejournal:ci
          for _ in $(seq 1 30); do curl --fail --silent http://localhost:8000/healthz > /dev/null && break; sleep 1; done
          curl --fail --silent http://localhost:8000/healthz | grep --quiet '"status":"ok"'
          curl --fail --silent --header 'Accept: text/html' http://localhost:8000/trades | grep --quiet 'id="root"'
          headers=$(curl --fail --silent --head --header 'Accept: text/html' http://localhost:8000/)
          echo "$headers" | grep --ignore-case --quiet "^content-security-policy:.*script-src 'self'"
          echo "$headers" | grep --ignore-case --quiet '^x-content-type-options: nosniff'
          asset=$(curl --fail --silent --header 'Accept: text/html' http://localhost:8000/ | grep --only-matching '/assets/[^"]*\.js' | head -1)
          test -n "$asset"
          curl --fail --silent --head "http://localhost:8000$asset" \
            | grep --ignore-case --quiet 'cache-control: public, max-age=31536000, immutable'

      # Fail closed: the image defaults to production mode, which must refuse to start without its settings.
      - name: Refuses to start unconfigured
        run: |
          set +e
          output=$(docker run --rm tradejournal:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep --quiet 'TJ_SESSION_SECRET is required in production'

      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id tradejournal:ci -u)" = "10001"

      - name: Container log (on failure)
        if: failure()
        run: docker logs tj || true

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc

      # Same version as `packageManager` in package.json. Installed from the npm registry rather than
      # through Corepack, which is dropped from Node 25 and later.
      - name: Install pnpm
        run: npm install --global pnpm@12.8.1

      # --frozen-lockfile refuses to change the lock file. pnpm-workspace.yaml holds the supply-chain
      # settings: a 24-hour release delay, and dependency build scripts fail the install unless reviewed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The committed types must be exactly what the committed backend/openapi.json generates, so the API and the
      # front end cannot drift. (The other half of the chain, openapi.json matching the Python code, is a pytest test
      # in the "Lint and test" job.) Runs before the type check: a stale file would otherwise surface as a confusing
      # type error.
      - name: API types match backend/openapi.json
        run: |
          pnpm gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Fails if the entry chunk is over 150 KB gzipped (the chart and editor must stay lazily loaded).
      - name: Bundle budget
        run: pnpm check:bundle

      # Raw HTML only through SafeHtml; no build-time environment values; no source maps or secret-shaped strings in
      # the build (doc 04, launch gates). --require-dist makes a missing build a failure, not a skipped check.
      - name: Security gates
        run: pnpm check:security --require-dist

      - name: Dependency audit
        run: pnpm audit --audit-level high
